<!DOCTYPE html>
<html>
<head>
    <title>Product List</title>

    <style>
        body {
            font-family: Arial;
            margin: 40px;
        }

        .product {
            border: 1px solid #ccc;
            padding: 15px;
            margin: 10px;
            width: 250px;
        }
    </style>
</head>

<body>

    <h1>Product List</h1>

    <div id="products">
        Loading products...
    </div>

    <script>
        fetch("/products")
            .then(response => response.json())
            .then(data => {

                let output = "";

                data.forEach(product => {
                    output += `
                        <div class="product">
                            <h2>${product.name}</h2>
                            <p>Product ID: ${product.id}</p>
                            <p>Price: ₹${product.price}</p>
                        </div>
                    `;
                });

                document.getElementById("products").innerHTML = output;
            })
            .catch(error => {
                document.getElementById("products").innerHTML =
                    "Error loading products";
                console.log(error);
            });
    </script>

</body>
</html>
